<div class="card h-100 bg-dark border-secondary" x-data="commands">
    
    <div class="card-header border-secondary">
        <i class="bi bi-cpu"></i> Machine Peripherals
    </div>

    <div class="card-body d-flex flex-column gap-3 justify-content-center">
        
        <div class="row g-2 mb-2">
            <div class="col-6">
                <button type="button" 
                        class="btn w-100 py-3 d-flex flex-column align-items-center justify-content-center gap-2"
                        :class="$store.machine.components.laser ? 'btn-danger' : 'btn-outline-secondary'"
                        @click="toggleLaser()">
                    <i class="bi fs-4" :class="$store.machine.components.laser ? 'bi-brightness-high-fill' : 'bi-brightness-high'"></i>
                    <span class="small fw-bold" x-text="$store.machine.components.laser ? 'Laser ARMED' : 'Laser OFF'"></span>
                </button>
            </div>

            <div class="col-6">
                <button type="button" 
                        class="btn w-100 py-3 d-flex flex-column align-items-center justify-content-center gap-2"
                        :class="$store.machine.components.rotating ? 'btn-success' : 'btn-outline-secondary'"
                        @click="togglePrism()">
                    <i class="bi fs-4" :class="['bi-fan', $store.machine.components.rotating ? 'spin-animation' : '']"></i>
                    <span class="small fw-bold" x-text="$store.machine.components.rotating ? 'Motor SPINNING' : 'Motor OFF'"></span>
                </button>
            </div>
        </div>

        <hr class="border-secondary opacity-25 my-1">

        <div class="row g-3">
            
            <div class="col-12 col-md-6" 
                 x-data="{ tempSpindle: $store.machine.components.spindle }"
                 x-init="$watch('$store.machine.components.spindle', v => tempSpindle = v)">
                
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="small text-warning fw-bold">
                        <i class="bi bi-gear-wide-connected" :class="$store.machine.components.spindle > 0 ? 'spin-animation' : ''"></i> Spindle Speed
                    </span>
                    <span class="badge bg-warning text-dark font-monospace" 
                          x-text="Math.round((tempSpindle / 255) * 100) + '%'"></span>
                </div>
                
                <input type="range" class="form-range" min="0" max="255" 
                       x-model.number="tempSpindle"
                       @change="setSpindle(tempSpindle)">
            </div>

            <div class="col-12 col-md-6" 
                 x-data="{ tempFan: $store.machine.components.fan }"
                 x-init="$watch('$store.machine.components.fan', v => tempFan = v)">
                
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="small text-info fw-bold">
                        <i class="bi bi-fan" :class="$store.machine.components.fan > 0 ? 'spin-animation' : ''"></i> Fan Speed
                    </span>
                    <span class="badge bg-info text-dark font-monospace" 
                          x-text="Math.round((tempFan / 255) * 100) + '%'"></span>
                </div>
                
                <input type="range" class="form-range" min="0" max="255" 
                       x-model.number="tempFan"
                       @change="setFan(tempFan)">
            </div>

        </div>

        <button class="btn btn-outline-warning w-100 py-2" 
                type="button" 
                data-bs-toggle="modal" 
                data-bs-target="#diodemodal">
            <i class="bi bi-activity"></i> Run Diode Diagnostic
        </button>
    </div>

    <div class="modal fade" id="diodemodal" tabindex="-1" aria-hidden="true"
         x-data="{ 
             isTesting: false,  
             savedRef: false,
             elapsedSeconds: 0,
             testDuration: null,
             timerId: null,
             init() {
                 this.$watch('$store.machine.components.diodetest', (value) => {
                     if (this.isTesting && value !== null) {
                         this.stopTimer();
                         this.testDuration = this.elapsedSeconds;
                         this.isTesting = false;
                     }
                 });
             },
             startTest() {
                 this.isTesting = true;
                 this.elapsedSeconds = 0;
                 this.testDuration = null;
                 this.startTimer();
                 window.api.post('/control/diodetest');
             },
             startTimer() {
                 this.stopTimer();
                 this.timerId = setInterval(() => {
                     this.elapsedSeconds++;
                 }, 1000);
             },
             stopTimer() {
                 if (this.timerId) {
                     clearInterval(this.timerId);
                     this.timerId = null;
                 }
             },
             async saveFacetMeans() {
                 await window.api.post('/control/save_facet_means');
                 this.savedRef = true;
                 setTimeout(() => { this.savedRef = false; }, 2500);
             },
             formatTime(sec) {
                 const m = Math.floor(sec / 60);
                 const s = sec % 60;
                 return `${m}:${s < 10 ? '0' : ''}${s}`;
             }
         }">
        <div class="modal-dialog">
            <div class="modal-content bg-dark border-secondary text-light">
                <div class="modal-header border-secondary">
                    <h1 class="modal-title fs-5">Diode Diagnostic</h1>
                    <button type="button" class="btn-close btn-close-white" :disabled="isTesting" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center p-4">
                    <div x-show="isTesting" class="py-4">
                        <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;"></div>
                        <h5>Testing in progress...</h5>
                        <div class="fs-4 font-monospace text-warning my-2">
                            <i class="bi bi-stopwatch me-1"></i>
                            <span x-text="formatTime(elapsedSeconds)">0:00</span>
                        </div>
                        <p class="text-muted small mb-0">Measuring facet jitter profiles (typically takes ~1 minute).<br>Do not open the laser enclosure.</p>
                    </div>
                    <div x-show="!isTesting">
                        <template x-if="$store.machine.components.diodetest === null">
                            <div class="py-3">
                                <i class="bi bi-question-circle display-4 text-secondary"></i>
                                <p class="mt-2">No diagnostic data available.</p>
                                <button class="btn btn-primary w-100 mt-2" @click="startTest()">Run Initial Test</button>
                            </div>
                        </template>
                        <template x-if="$store.machine.components.diodetest !== null">
                            <div class="text-start">
                                <div class="text-center mb-4">
                                    <i class="bi display-1" :class="$store.machine.components.diodetest.passed ? 'bi-check-circle-fill text-success' : 'bi-exclamation-triangle-fill text-danger'"></i>
                                    <h4 class="mt-2" :class="$store.machine.components.diodetest.passed ? 'text-success' : 'text-danger'">
                                        <span x-text="$store.machine.components.diodetest.passed ? 'System Passed' : 'Diagnostic Failed'"></span>
                                        <template x-if="testDuration !== null">
                                            <span class="fs-6 text-muted ms-2 font-monospace" x-text="`in ${testDuration}s`"></span>
                                        </template>
                                    </h4>
                                </div>
                                <div class="row text-center mb-4">
                                    <div class="col border-end border-secondary">
                                        <small class="text-muted text-uppercase" style="font-size: 0.75rem;">Measured Speed</small>
                                        <div class="fs-5 font-monospace text-info" x-text="`${$store.machine.components.diodetest.measured_rpm} RPM`"></div>
                                    </div>
                                    <div class="col">
                                        <small class="text-muted text-uppercase" style="font-size: 0.75rem;">RPM Deviation</small>
                                        <div class="fs-5 font-monospace" x-text="`${$store.machine.components.diodetest.global_deviation_perc.toFixed(2)} %`"></div>
                                    </div>
                                </div>
                                <h6 class="text-muted mb-2 border-bottom border-secondary pb-2">Facet Breakdown</h6>
                                <div class="list-group list-group-flush border-secondary">
                                    <template x-for="(data, facetId) in $store.machine.components.diodetest.facets" :key="facetId">
                                        <div class="list-group-item bg-transparent text-light border-secondary px-1 d-flex justify-content-between align-items-center">
                                            <div>
                                                <span class="badge me-2" :class="data.passed ? 'bg-success' : 'bg-danger'" x-text="`Facet ${facetId}`"></span>
                                                <small class="font-monospace text-light me-1" x-text="`${data.mean_ms.toFixed(4)} ms`"></small>
                                                <template x-if="data.ref_mean_ms !== undefined">
                                                    <small class="text-muted font-monospace me-2" x-text="`(Ref: ${data.ref_mean_ms.toFixed(4)} ms)`"></small>
                                                </template>
                                                <template x-if="data.cpk !== undefined">
                                                    <span class="badge bg-dark border border-secondary text-info" x-text="`Cpk ${data.cpk.toFixed(2)}`"></span>
                                                </template>
                                            </div>
                                            <div class="text-end" :class="data.passed ? 'text-success' : 'text-danger'">
                                                <i class="bi me-1" :class="data.passed ? 'bi-check2' : 'bi-x-lg'"></i>
                                                <span class="font-monospace" x-text="`${data.jitter_perc.toFixed(4)}%`"></span>
                                                <template x-if="data.pct_in_spec !== undefined">
                                                    <div class="text-muted small" style="font-size: 0.7rem;" x-text="`${data.pct_in_spec.toFixed(1)}% in spec`"></div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button x-show="!isTesting && $store.machine.components.diodetest !== null" 
                            type="button" 
                            class="btn me-auto transition-all" 
                            :class="savedRef ? 'btn-success text-white' : 'btn-outline-success'"
                            data-bs-toggle="tooltip" 
                            data-bs-placement="top" 
                            title="Save measured facet means as calibration reference in config"
                            @click="saveFacetMeans()">
                        <i class="bi me-1" :class="savedRef ? 'bi-check-circle-fill' : 'bi-bookmark-check'"></i>
                        <span x-text="savedRef ? 'Reference Saved!' : 'Save as Reference'"></span>
                    </button>
                    <button x-show="!isTesting && $store.machine.components.diodetest !== null" type="button" class="btn btn-outline-primary" @click="startTest()">
                        <i class="bi bi-arrow-clockwise"></i> Remeasure
                    </button>
                    <button type="button" class="btn btn-secondary" :disabled="isTesting" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Animate any element given the 'spin-animation' class */
    .spin-animation {
        animation: spin 1s linear infinite;
        display: inline-block;
        transform-origin: center; 
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
