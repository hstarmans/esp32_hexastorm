<!-- Collapsible Camera & Calibration Dashboard Panel -->
<div class="card bg-dark border-secondary shadow-sm mb-4" id="cameraPanel" x-show="$store.machine.showCamera" x-cloak
    x-data="{
         imgUrl: '',
         currentBlobUrl: '',
         autoRefresh: false,
         intervalId: null,
         refreshInterval: 5,
         loading: false,
         errorMsg: null,
         lastUpdated: 'Not yet captured',

         async refresh() {
             if (this.loading) return;
             this.loading = true;
             this.errorMsg = null;
             try {
                 const res = await fetch('/api/camera/snapshot?t=' + Date.now());
                 if (!res.ok) {
                     const txt = await res.text();
                     this.errorMsg = txt || ('Camera error (HTTP ' + res.status + ')');
                     return;
                 }
                 const blob = await res.blob();
                 if (this.currentBlobUrl) {
                     URL.revokeObjectURL(this.currentBlobUrl);
                 }
                 this.currentBlobUrl = URL.createObjectURL(blob);
                 this.imgUrl = this.currentBlobUrl;
                 const now = new Date();
                 this.lastUpdated = now.toLocaleTimeString();
             } catch (err) {
                 this.errorMsg = 'Connection error: ' + (err.message || 'Could not reach server');
             } finally {
                 this.loading = false;
             }
         },

         toggleAuto() {
             this.autoRefresh = !this.autoRefresh;
             if (this.autoRefresh) {
                 this.startAuto();
             } else {
                 this.stopAuto();
             }
         },

         startAuto() {
             this.stopAuto();
             this.autoRefresh = true;
             this.refresh();
             const sec = Math.max(1, Number(this.refreshInterval || 5));
             this.intervalId = setInterval(() => this.refresh(), sec * 1000);
         },

         restartAuto() {
             if (this.autoRefresh) {
                 this.startAuto();
             }
         },

         stopAuto() {
             this.autoRefresh = false;
             if (this.intervalId) {
                 clearInterval(this.intervalId);
                 this.intervalId = null;
             }
         }
     }"
    x-init='$watch("$store.machine.showCamera", val => { if (val && !imgUrl) refresh(); }); if ($store.machine.showCamera) refresh();'>

    <!-- Card Header with Close button -->
    <div class="card-header border-secondary d-flex justify-content-between align-items-center py-2">
        <span class="d-flex align-items-center gap-2">
            <i class="bi bi-camera-fill text-warning"></i>
            <strong class="text-uppercase small" style="letter-spacing: 1px;">Camera &amp; Calibration</strong>
        </span>
        <div class="d-flex align-items-center gap-2">
            <template x-if="autoRefresh && !loading">
                <span class="badge bg-success d-inline-flex align-items-center gap-1">
                    <i class="bi bi-arrow-repeat spin-animation"></i> Auto (<span
                        x-text="refreshInterval + 's'"></span>)
                </span>
            </template>
            <template x-if="loading">
                <span class="text-warning small d-inline-flex align-items-center gap-1">
                    <span class="spinner-border spinner-border-sm" role="status"
                        style="width: 0.8rem; height: 0.8rem;"></span> Capturing...
                </span>
            </template>
            <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2"
                @click="$store.machine.showCamera = false" title="Close Camera Panel">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>

    <div class="card-body p-3">
        <div class="row g-3">
            <!-- Left Column: Camera Live Feed & Stream Controls -->
            <div class="col-12 col-lg-8">
                <div class="bg-black rounded border border-secondary p-2 d-flex flex-column align-items-center justify-content-center position-relative"
                    style="min-height: 340px; max-height: 480px; overflow: hidden;">

                    <!-- Hardware / Connection Error Alert -->
                    <template x-if="errorMsg">
                        <div class="alert alert-danger d-flex align-items-center gap-2 w-100 mb-2 shadow text-start"
                            role="alert">
                            <i class="bi bi-exclamation-triangle-fill fs-4 flex-shrink-0"></i>
                            <div>
                                <div class="fw-bold">Camera Capture Error</div>
                                <div class="small font-monospace" x-text="errorMsg"></div>
                            </div>
                        </div>
                    </template>

                    <!-- Camera Image Display -->
                    <template x-if="imgUrl && !errorMsg">
                        <img :src="imgUrl" class="img-fluid rounded border border-secondary shadow-sm" alt="Camera Feed"
                            style="max-height: 440px; width: 100%; object-fit: contain;">
                    </template>

                    <!-- Placeholder before first capture -->
                    <template x-if="!imgUrl && !errorMsg">
                        <div class="text-secondary py-5 text-center">
                            <i class="bi bi-camera fs-1 d-block mb-2 opacity-50"></i>
                            <span class="small">Click "Capture Now" or enable "Auto (10s)" to load image</span>
                        </div>
                    </template>
                </div>

                <!-- Feed Controls Bar -->
                <div class="d-flex justify-content-between align-items-center mt-2 px-1 flex-wrap gap-2">
                    <div class="small text-secondary font-monospace">
                        <i class="bi bi-clock-history me-1"></i>Updated:
                        <strong class="text-light" x-text="lastUpdated"></strong>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <!-- Auto Refresh Rate Controls -->
                        <div class="input-group input-group-sm" style="width: auto;">
                            <button type="button" class="btn btn-sm d-flex align-items-center gap-1"
                                :class="autoRefresh ? 'btn-success' : 'btn-outline-secondary'" @click="toggleAuto()"
                                title="Toggle automatic periodic frame refresh">
                                <i class="bi" :class="autoRefresh ? 'bi-stop-circle-fill' : 'bi-arrow-repeat'"></i>
                                <span x-text="autoRefresh ? 'Stop' : 'Auto'"></span>
                            </button>
                            <select class="form-select form-select-sm bg-dark text-light border-secondary"
                                style="width: 5.2rem;" x-model.number="refreshInterval" @change="restartAuto()"
                                title="Auto Refresh Rate">
                                <option value="1">1s</option>
                                <option value="2">2s</option>
                                <option value="3">3s</option>
                                <option value="5">5s</option>
                                <option value="10">10s</option>
                                <option value="30">30s</option>
                            </select>
                        </div>

                        <button type="button" class="btn btn-sm btn-primary d-flex align-items-center gap-1 px-3"
                            :disabled="loading" @click="refresh()">
                            <span class="spinner-border spinner-border-sm me-1" role="status" x-show="loading"></span>
                            <i class="bi bi-camera me-1" x-show="!loading"></i>
                            <span x-text="loading ? 'Capturing...' : 'Capture Now'"></span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Column: Calibration Controls -->
            <div class="col-12 col-lg-4 d-flex flex-column justify-content-between">

                <!-- Target Camera Position Card -->
                <div class="bg-black bg-opacity-25 rounded border border-secondary p-3 mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="fw-bold small text-light">
                            <i class="bi bi-crosshair text-danger me-1"></i> Camera Position
                        </span>
                        <span class="badge bg-secondary font-monospace" style="font-size: 0.7rem;">MPos Target</span>
                    </div>

                    <!-- Target Coordinates Display -->
                    <div
                        class="font-monospace small bg-black p-2 rounded border border-secondary mb-3 d-flex justify-content-around text-center">
                        <div>
                            <span class="text-secondary me-1">X:</span>
                            <strong class="text-danger"
                                x-text="($store.machine.calibration?.camera_position?.[0] ?? 90).toFixed(2)"></strong>
                        </div>
                        <div>
                            <span class="text-secondary me-1">Y:</span>
                            <strong class="text-success"
                                x-text="($store.machine.calibration?.camera_position?.[1] ?? 0).toFixed(2)"></strong>
                        </div>
                        <div>
                            <span class="text-secondary me-1">Z:</span>
                            <strong class="text-info"
                                x-text="($store.machine.calibration?.camera_position?.[2] ?? 10).toFixed(2)"></strong>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex flex-column gap-2">
                        <button type="button"
                            class="btn btn-sm btn-outline-warning w-100 py-2 d-flex align-items-center justify-content-center gap-2"
                            @click="api.moveToCamera()"
                            title="Move laser head directly above camera sensor in machine coordinates">
                            <i class="bi bi-box-arrow-in-down-right"></i>
                            <span>Go to Camera Position</span>
                        </button>

                        <button type="button"
                            class="btn btn-sm btn-outline-light w-100 py-2 d-flex align-items-center justify-content-center gap-2"
                            @click="api.saveCameraPos($store.machine.mpos)"
                            title="Save current machine position (MPos) as the calibration camera location">
                            <i class="bi bi-bookmark-check-fill text-success"></i>
                            <span>Set Current MPos as Target</span>
                        </button>
                    </div>
                </div>

                <!-- Laser Exposure Control (in ms) -->
                <div class="bg-black bg-opacity-25 rounded border border-secondary p-3 mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="fw-bold small text-light">
                            <i class="bi bi-stopwatch text-warning me-1"></i> Exposure Time (Shutter)
                        </span>
                        <span class="badge bg-dark border border-secondary text-warning font-monospace"
                            x-text="($store.machine.calibration?.camera_exposure_ms ?? 200) + ' ms'">
                        </span>
                    </div>

                    <!-- Number Input in ms -->
                    <div class="input-group input-group-sm mt-2 mb-2">
                        <span class="input-group-text bg-dark text-warning border-secondary"><i
                                class="bi bi-stopwatch"></i></span>
                        <input type="number" class="form-control bg-dark text-light border-secondary font-monospace"
                            min="1" max="2000" step="5" :value="$store.machine.calibration?.camera_exposure_ms ?? 200"
                            @change="api.setCameraExposure($event.target.value); refresh();" placeholder="200">
                        <span class="input-group-text bg-dark text-secondary border-secondary">ms</span>
                    </div>

                    <!-- Quick Preset Buttons -->
                    <div class="btn-group w-100" role="group" aria-label="Exposure Presets">
                        <button type="button" class="btn btn-sm btn-outline-secondary py-1"
                            :class="($store.machine.calibration?.camera_exposure_ms === 5) ? 'active btn-secondary' : ''"
                            @click="api.setCameraExposure(5); refresh();" title="5 ms (1 facet sweep)">5ms</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary py-1"
                            :class="($store.machine.calibration?.camera_exposure_ms === 50) ? 'active btn-secondary' : ''"
                            @click="api.setCameraExposure(50); refresh();" title="50 ms (10 facet sweeps)">50ms</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary py-1"
                            :class="($store.machine.calibration?.camera_exposure_ms === 200) ? 'active btn-secondary' : ''"
                            @click="api.setCameraExposure(200); refresh();"
                            title="200 ms (40 facet sweeps)">200ms</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary py-1"
                            :class="($store.machine.calibration?.camera_exposure_ms === 1000) ? 'active btn-secondary' : ''"
                            @click="api.setCameraExposure(1000); refresh();" title="1000 ms (1 second)">1s</button>
                    </div>
                    <div class="text-secondary mt-1 text-center" style="font-size: 0.72rem;">
                        Manual laser integration time (AEC, AGC, AWB off).
                    </div>
                </div>

                <!-- Scan Visibility & Optical Calibration Card -->
                <div class="bg-black bg-opacity-25 rounded border border-secondary p-3 mb-3"
                    x-data="{
                        scanning: false,
                        calibrating: false,
                        previewFacet: '0',
                        scanResult: null,
                        scanError: null,
                        calibReport: null,

                        get activeReport() {
                            return this.calibReport || $store.machine.calibration?.last_report;
                        },

                        async runScan() {
                            if (this.scanning || this.calibrating) return;
                            this.scanning = true;
                            this.scanError = null;
                            this.scanResult = null;
                            try {
                                const res = await api.runScanVisibility(0, 20);
                                if (res.visible_pixels) {
                                    this.scanResult = `Visible: px ${res.visible_pixels[0]} - ${res.visible_pixels[1]} (${res.percentage}%)`;
                                } else {
                                    this.scanResult = 'No laser signal detected in FOV';
                                }
                                refresh();
                            } catch (err) {
                                this.scanError = err.message || 'Scan visibility failed';
                            } finally {
                                this.scanning = false;
                            }
                        },

                        async toggleBounds() {
                            try {
                                const nextEnabled = !($store.machine.calibration?.bounds_active);
                                const res = await fetch('/api/calibration/show_bounds', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ enabled: nextEnabled, facet: this.previewFacet })
                                });
                                if (res.ok) {
                                    const data = await res.json();
                                    if ($store.machine.calibration) {
                                        $store.machine.calibration.bounds_active = data.bounds_active;
                                    }
                                }
                                refresh();
                            } catch (err) {
                                this.scanError = err.message || 'Preview dots failed';
                            }
                        },

                        async changePreviewFacet() {
                            try {
                                const res = await fetch('/api/calibration/show_bounds', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ enabled: true, facet: this.previewFacet })
                                });
                                if (res.ok) {
                                    const data = await res.json();
                                    if ($store.machine.calibration) {
                                        $store.machine.calibration.bounds_active = data.bounds_active;
                                    }
                                }
                                refresh();
                            } catch (err) {
                                this.scanError = err.message || 'Update preview facet failed';
                            }
                        },

                        async saveCustomFacets(applyCorr = null) {
                            try {
                                const rep = this.activeReport;
                                const corr = applyCorr !== null ? applyCorr : ($store.machine.calibration?.apply_correction !== false);
                                const payload = {
                                    facets: rep ? rep.facets : null,
                                    apply_correction: corr
                                };
                                const res = await fetch('/api/calibration/update_facets', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(payload)
                                });
                                if (res.ok) {
                                    const data = await res.json();
                                    if ($store.machine.calibration) {
                                        $store.machine.calibration.apply_correction = data.apply_correction;
                                    }
                                }
                                refresh();
                            } catch (err) {
                                this.scanError = err.message || 'Saving facet offsets failed';
                            }
                        },

                        async runVerifyCalibration(calibrateFirst = true) {
                            if (this.scanning || this.calibrating) return;
                            this.calibrating = true;
                            this.scanError = null;
                            try {
                                if (!calibrateFirst && this.activeReport) {
                                    await fetch('/api/calibration/update_facets', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({
                                            facets: this.activeReport.facets,
                                            apply_correction: true
                                        })
                                    });
                                }
                                const res = await fetch('/api/calibration/pattern_error', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ num_dots: 6, calibrate_first: calibrateFirst })
                                });
                                if (!res.ok) {
                                    const errData = await res.json().catch(() => ({}));
                                    throw new Error(errData.error || ('HTTP ' + res.status));
                                }
                                const report = await res.json();
                                this.calibReport = report;
                                refresh();
                            } catch (err) {
                                this.scanError = err.message || 'Calibration failed';
                            } finally {
                                this.calibrating = false;
                            }
                        }
                    }">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="fw-bold small text-light">
                            <i class="bi bi-arrows-expand text-info me-1"></i> Scan Visibility &amp; Calibration
                        </span>
                        <template x-if="$store.machine.calibration?.visible_pixels">
                            <span class="badge bg-info text-dark font-monospace" style="font-size: 0.7rem;"
                                x-text="'px ' + $store.machine.calibration.visible_pixels[0] + '..' + $store.machine.calibration.visible_pixels[1]">
                            </span>
                        </template>
                        <template x-if="!$store.machine.calibration?.visible_pixels">
                            <span class="badge bg-secondary font-monospace" style="font-size: 0.7rem;">Uncalibrated</span>
                        </template>
                    </div>

                    <!-- Status / Result Message -->
                    <template x-if="scanResult">
                        <div class="alert alert-success py-1 px-2 small mb-2 text-center font-monospace" style="font-size: 0.76rem;" x-text="scanResult"></div>
                    </template>
                    <template x-if="scanError">
                        <div class="alert alert-danger py-1 px-2 small mb-2 text-center font-monospace" style="font-size: 0.76rem;" x-text="scanError"></div>
                    </template>

                    <!-- Scanning / Calibration Progress Bar -->
                    <div class="progress mb-2" x-show="scanning || calibrating" style="height: 6px;">
                        <div class="progress-bar progress-bar-striped progress-bar-animated bg-info" role="progressbar" style="width: 100%;"></div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex gap-2 mb-2">
                        <button type="button" class="btn btn-sm btn-outline-info flex-grow-1 py-2 d-flex align-items-center justify-content-center gap-1"
                            :disabled="scanning || calibrating" @click="runScan()"
                            title="Run automated scanline visibility test (SVGA 800x600 grayscale with dark-frame subtraction)">
                            <span class="spinner-border spinner-border-sm me-1" role="status" x-show="scanning"></span>
                            <i class="bi bi-search" x-show="!scanning"></i>
                            <span x-text="scanning ? 'Scanning...' : 'Scan Visibility'"></span>
                        </button>

                        <div class="input-group input-group-sm" style="width: auto;">
                            <button type="button" class="btn btn-sm py-2 d-flex align-items-center justify-content-center gap-1"
                                :class="$store.machine.calibration?.bounds_active ? 'btn-warning' : 'btn-outline-warning'"
                                @click="toggleBounds()"
                                title="Project 6 calibration dots within visible sensor bounds">
                                <i class="bi" :class="$store.machine.calibration?.bounds_active ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
                                <span x-text="$store.machine.calibration?.bounds_active ? 'Hide Dots' : 'Preview Dots'"></span>
                            </button>
                            <select class="form-select form-select-sm bg-dark text-light border-secondary font-monospace"
                                style="width: 4.5rem;" x-model="previewFacet" @change="changePreviewFacet()"
                                title="Select facet for Preview Dots (F1..F4 or All)">
                                <option value="0">F1</option>
                                <option value="1">F2</option>
                                <option value="2">F3</option>
                                <option value="3">F4</option>
                                <option value="all">All</option>
                            </select>
                        </div>
                    </div>

                    <!-- Calibrate & Verify Button -->
                    <button type="button" class="btn btn-sm btn-outline-success w-100 py-2 d-flex align-items-center justify-content-center gap-1"
                        :disabled="scanning || calibrating" @click="runVerifyCalibration()"
                        title="Measure 2D facet offsets (Scan & Orthogonal), apply corrections, and verify residual error <= 30 um">
                        <span class="spinner-border spinner-border-sm me-1" role="status" x-show="calibrating"></span>
                        <i class="bi bi-bullseye" x-show="!calibrating"></i>
                        <span x-text="calibrating ? 'Calibrating & Verifying...' : 'Calibrate & Verify (2D)'"></span>
                    </button>

                    <!-- Verified Calibration Report Table -->
                    <template x-if="activeReport">
                        <div class="mt-3 pt-2 border-top border-secondary">
                            <div class="d-flex justify-content-between align-items-center mb-1 flex-wrap gap-1">
                                <span class="small fw-bold text-light">2D Facet Error (µm)</span>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="form-check form-switch mb-0 d-flex align-items-center gap-1" title="Toggle facet corrections in live feed">
                                        <input class="form-check-input mt-0" type="checkbox" role="switch" id="applyCorrSwitch"
                                            :checked="$store.machine.calibration?.apply_correction !== false"
                                            @change="saveCustomFacets($event.target.checked)">
                                        <label class="form-check-label text-secondary font-monospace" for="applyCorrSwitch" style="font-size: 0.68rem;">Correctie</label>
                                    </div>
                                    <span class="badge font-monospace"
                                        :class="activeReport.passed ? 'bg-success' : 'bg-danger'"
                                        x-text="activeReport.passed ? 'PASSED (<= ' + activeReport.tolerance_um + ' µm)' : 'FAILED (> ' + activeReport.tolerance_um + ' µm)'">
                                    </span>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-dark table-sm table-bordered border-secondary mb-1 font-monospace text-center align-middle" style="font-size: 0.68rem;">
                                    <thead>
                                        <tr class="text-secondary">
                                            <th>F</th>
                                            <th>Voor (S/O)</th>
                                            <th>Correctie (Scan / Orth µm)</th>
                                            <th>Na (S/O)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="f in activeReport.facets" :key="f.facet">
                                            <tr>
                                                <td class="fw-bold text-info" x-text="'F' + (f.facet + 1)"></td>
                                                <td class="text-warning" x-text="f.before_scan_um.toFixed(1) + ' / ' + f.before_orth_um.toFixed(1)"></td>
                                                <td class="p-1">
                                                    <div class="d-flex gap-1 justify-content-center">
                                                        <input type="number" step="0.5"
                                                            class="form-control form-control-sm bg-black text-info border-secondary text-center p-0 font-monospace"
                                                            style="width: 3.4rem; font-size: 0.68rem; height: 1.4rem;"
                                                            x-model.number="f.corr_scan_um"
                                                            @change="saveCustomFacets(true)"
                                                            title="Scan shift correctie (µm)">
                                                        <input type="number" step="0.5"
                                                            class="form-control form-control-sm bg-black text-info border-secondary text-center p-0 font-monospace"
                                                            style="width: 3.4rem; font-size: 0.68rem; height: 1.4rem;"
                                                            x-model.number="f.corr_orth_um"
                                                            @change="saveCustomFacets(true)"
                                                            title="Orthogonale shift correctie (µm)">
                                                    </div>
                                                </td>
                                                <td class="fw-bold"
                                                    :class="(Math.abs(f.after_scan_um) <= activeReport.tolerance_um && Math.abs(f.after_orth_um) <= activeReport.tolerance_um) ? 'text-success' : 'text-danger'"
                                                    x-text="f.after_scan_um.toFixed(1) + ' / ' + f.after_orth_um.toFixed(1)">
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                            <div class="d-flex justify-content-between align-items-center text-secondary font-monospace mb-2" style="font-size: 0.68rem;">
                                <span>Max Voor: <strong class="text-warning" x-text="activeReport.max_error_before_um.toFixed(1) + ' µm'"></strong></span>
                                <span>Max Na: <strong :class="activeReport.passed ? 'text-success' : 'text-danger'" x-text="activeReport.max_error_after_um.toFixed(1) + ' µm'"></strong></span>
                                <span>Spot: <strong class="text-light" x-text="(activeReport.facets[0]?.spot_size_um ?? 0).toFixed(1) + ' µm'"></strong></span>
                            </div>
                            <button type="button" class="btn btn-sm btn-outline-info w-100 py-1 d-flex align-items-center justify-content-center gap-1"
                                style="font-size: 0.74rem;"
                                :disabled="scanning || calibrating" @click="runVerifyCalibration(false)"
                                title="Test en verifieer de hierboven ingevoerde Correctie (Scan / Orth) waarden met de camera">
                                <i class="bi bi-sliders"></i>
                                <span>Test Custom Correctie (Herverifieer 2D)</span>
                            </button>
                        </div>
                    </template>
                </div>

                <!-- Helpful Alignment Tip -->
                <div class="alert alert-dark border-secondary p-2 small mb-0 text-secondary"
                    style="font-size: 0.78rem;">
                    <i class="bi bi-info-circle text-info me-1"></i>
                    <span>Use <strong>Motion Control</strong> above for X/Y/Z adjustments, and <strong>Machine
                            Peripherals</strong> to toggle the laser and prism during alignment.</span>
                </div>
