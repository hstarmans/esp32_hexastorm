name: CI & Firmware Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Run pytest
        run: uv run pytest

      - name: Run ruff
        run: uv run ruff check src docker

      - name: Run pyrefly
        run: uv run pyrefly check

  firmware:
    name: Build ESP32-S3 Firmware (Docker)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build firmware builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hexastorm-esp32s3-builder:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run MicroPython + ulab calibration test
        run: |
          docker run --rm \
            --entrypoint /workspace/docker/run-mpy-tests.sh \
            -v "${{ github.workspace }}:/workspace" \
            hexastorm-esp32s3-builder:ci

      - name: Compile HEXASTORM_S3 firmware
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -e IDF_GIT_SAFE_DIR=/workspace:/opt/micropython \
            -e FIRMWARE_VERSION="${{ github.ref_type == 'tag' && github.ref_name || '' }}" \
            hexastorm-esp32s3-builder:ci
          test -f build/HEXASTORM_S3/micropython.bin
          test -f src/root/sd/fpga/fpga.bit

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hexastorm-esp32s3-firmware
          path: |
            build/HEXASTORM_S3/micropython.bin
            build/HEXASTORM_S3/firmware.bin
            build/HEXASTORM_S3/bootloader/bootloader.bin
            build/HEXASTORM_S3/partition_table/partition-table.bin
            build/HEXASTORM_S3/ota_data_initial.bin
            src/root/sd/fpga/fpga.bit

      - name: Publish OTA firmware to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/HEXASTORM_S3/micropython.bin
